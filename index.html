<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu brújula de liderazgo — Liderazgo en escena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F0E6; --bg2:#EAE4D2; --panel:#FFFFFF;
    --line:rgba(63,90,58,0.18);
    --teal:#0E8F84; --gold:#C99A2E; --gold-light:#F5C842;
    --moss:#3F5A3A; --bronze:#8B5530; --ink:#26301F;
    --text:#2B3328; --text-dim:#6E7C66; --cream-text:#FDFBF4;
    --font-d:'Bebas Neue',sans-serif; --font-b:'Playfair Display',serif; --font-m:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-b);}
  body{min-height:100vh;position:relative;overflow-x:hidden;}
  .bg-contours{position:fixed;inset:0;z-index:0;opacity:0.10;pointer-events:none;}
  #app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--gold-light);color:var(--ink);}

  .eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal);margin:0 0 8px;}
  h1,h2,h3{font-family:var(--font-d);letter-spacing:0.02em;font-weight:400;margin:0;}
  h1{font-size:40px;line-height:1.05;color:var(--ink);}
  h2{font-size:28px;color:var(--ink);}
  h3{font-size:20px;color:var(--bronze);}
  p{line-height:1.65;margin:0 0 14px;color:var(--text);}
  .dim{color:var(--text-dim);}
  .italic{font-style:italic;color:var(--moss);}

  .screen{padding:28px 20px 100px;flex:1;animation:fadein 0.4s ease;}
    .screen.noanim{animation:none;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .btn{font-family:var(--font-d);font-size:16px;letter-spacing:0.06em;text-transform:uppercase;
    background:var(--moss);color:var(--cream-text);border:none;border-radius:3px;
    padding:14px 22px;cursor:pointer;width:100%;transition:transform 0.15s,background 0.2s;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{background:var(--line);color:var(--text-dim);cursor:not-allowed;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.small{padding:9px 14px;font-size:13px;width:auto;flex:1;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:12px;}

  .header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:rgba(243,240,230,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .header .logo{font-family:var(--font-d);font-size:18px;letter-spacing:0.05em;color:var(--bronze);}
  .info-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text-dim);
    font-family:var(--font-m);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  /* Arquetipos */
  .arch-card{border-radius:4px;padding:18px;margin-bottom:14px;border:1px solid var(--line);background:var(--panel);}
  .arch-card.purista{border-left:3px solid var(--moss);}
  .arch-card.guardian{border-left:3px solid var(--bronze);}
  .arch-card.puente{border-left:3px solid var(--teal);}
  .divider{height:1px;background:var(--line);margin:22px 0;}

  /* Brújula interactiva */
  .compass{width:100%;display:block;margin:0 auto 6px;}
  .sector{fill:var(--bg2);stroke:var(--bg);stroke-width:2;cursor:pointer;transition:fill 0.45s;}
  .sector.visited{fill:rgba(63,90,58,0.30);}
  .sector.current{fill:var(--gold-light);}
  .clabel{font-family:var(--font-b);font-size:12.5px;fill:var(--text-dim);cursor:pointer;transition:fill 0.3s;}
  .clabel.visited{fill:var(--moss);}
  .clabel.current{fill:var(--ink);font-weight:600;}
  .cdir{font-family:var(--font-m);font-size:9px;fill:var(--text-dim);text-anchor:middle;pointer-events:none;}
  #ring-prog{transition:stroke-dashoffset 0.55s ease;}
  #needle{transition:transform 0.6s cubic-bezier(.45,1.45,.55,1);}
  .cap-card{min-height:130px;transition:opacity 0.2s;}
  .cap-card.fade{opacity:0.15;}
  .compass-count{font-family:var(--font-m);font-size:12px;color:var(--text-dim);text-align:center;margin:4px 0 14px;}
  .compass-count b{color:var(--gold);}

  /* Constructor */
  .mix-banner{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:16px;}
  .mix-dots{display:flex;flex-direction:column;gap:4px;padding-top:4px;}
  .mix-dots span{width:10px;height:10px;border-radius:50%;}
  .mix-banner p{margin:0;font-size:13.5px;line-height:1.55;}

  .cat-tabs{display:flex;gap:6px;margin-bottom:12px;}
  .cat-tab{flex:1;text-align:center;padding:9px 4px 7px;border-radius:3px;border:1px solid var(--line);cursor:pointer;background:transparent;}
  .cat-tab .ct-name{font-family:var(--font-d);font-size:14px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);display:block;}
  .cat-tab .ct-count{font-family:var(--font-m);font-size:11px;color:var(--text-dim);}
  .cat-tab.active{background:var(--ink);border-color:var(--ink);}
  .cat-tab.active .ct-name,.cat-tab.active .ct-count{color:var(--cream-text);}
  .cat-tab.full .ct-count{color:var(--moss);font-weight:500;}
  .cat-tab.active.full .ct-count{color:var(--gold-light);}

  .cat-intro{font-size:13.5px;color:var(--text);margin:4px 0 12px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{font-family:var(--font-m);font-size:11px;padding:5px 10px;border-radius:14px;border:1px solid var(--line);cursor:pointer;color:var(--text-dim);background:transparent;}
  .chip.active{background:var(--bg2);color:var(--ink);border-color:var(--text-dim);}

  .skill-card{border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-bottom:8px;cursor:pointer;
    background:var(--panel);transition:border-color 0.15s,background 0.15s;}
  .skill-card.selected{border-color:var(--gold);background:rgba(201,154,46,0.12);box-shadow:inset 3px 0 0 var(--gold);}
  .skill-card.disabled{opacity:0.42;cursor:default;}
  .skill-card .sname{font-family:var(--font-b);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:3px;}
  .skill-card .sdesc{font-size:13px;color:var(--text-dim);font-style:italic;line-height:1.4;}
  .skill-card .stags{margin-top:7px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .badge{font-family:var(--font-m);font-size:9.5px;letter-spacing:0.05em;text-transform:uppercase;padding:2px 7px;border-radius:2px;color:var(--cream-text);}
  .badge.purista{background:var(--moss);} .badge.guardian{background:var(--bronze);} .badge.puente{background:var(--teal);}
  .tag{font-family:var(--font-m);font-size:10px;padding:2px 7px;border-radius:10px;
    background:rgba(14,143,132,0.10);color:var(--teal);border:1px solid rgba(14,143,132,0.28);}
  .note{font-family:var(--font-m);font-size:10px;color:var(--bronze);}

  input[type=text]{width:100%;padding:12px;border-radius:3px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-family:var(--font-b);font-size:15px;margin-bottom:16px;}
  label.flabel{font-family:var(--font-m);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);display:block;margin-bottom:6px;}

  .footer-bar{position:sticky;bottom:0;z-index:20;background:rgba(243,240,230,0.97);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);padding:12px 20px 14px;}
  .goal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px;}
  .goal-top .gt-count{font-family:var(--font-d);font-size:20px;color:var(--ink);letter-spacing:0.03em;}
  .goal-top .gt-msg{font-family:var(--font-m);font-size:11px;color:var(--text-dim);text-align:right;}
  .goal-top .gt-msg.near{color:var(--bronze);}
  .goal-top .gt-msg.done{color:var(--moss);font-weight:500;}
  .goal-cells{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:10px;}
  .goal-cells span{height:9px;border-radius:2px;background:var(--bg2);border:1px solid var(--line);transition:background 0.3s;}
  .goal-cells span.on{background:var(--gold);border-color:var(--gold);}
  .goal-cells span.on.done{background:var(--moss);border-color:var(--moss);}
  .goal-cells span:nth-child(4n){margin-right:5px;}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,25,18,0.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--panel);border-top:1px solid var(--line);border-radius:10px 10px 0 0;padding:22px 20px 30px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal h3{margin-bottom:14px;}
  .cap-item{margin-bottom:14px;}
  .cap-item .cname{font-family:var(--font-b);font-weight:600;color:var(--gold);margin-bottom:2px;}
  .cap-item .cdesc{font-size:13px;color:var(--text-dim);}

  /* Diagnóstico */
  .radar-grid{fill:none;stroke:var(--line);stroke-width:1;}
  .radar-shape{fill:rgba(14,143,132,0.22);stroke:var(--teal);stroke-width:2;}
  .radar-dot{fill:var(--teal);}
  .rlabel{font-family:var(--font-b);font-size:12.5px;fill:var(--text);}
  .rlabel.top{fill:var(--moss);font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .bar-label{width:100px;font-family:var(--font-m);font-size:10.5px;color:var(--text-dim);flex-shrink:0;}
  .bar-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .diag-list{margin:0;padding-left:18px;}
  .diag-list li{margin-bottom:8px;font-size:14px;}
  .diag-list .badge{margin-left:4px;vertical-align:1px;}

  @media print{
    .header,.footer-bar,.no-print,.bg-contours{display:none !important;}
    body{background:#fff;}
    .card{border:1px solid #ccc;break-inside:avoid;}
    .badge{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .bar-fill,.radar-shape{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>
<svg class="bg-contours" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <g fill="none" stroke="#3F5A3A" stroke-width="0.7">
    <path d="M-20,120 Q100,60 200,120 T420,120"/><path d="M-20,180 Q100,240 200,180 T420,180"/>
    <path d="M-20,500 Q120,440 220,500 T440,500"/><path d="M-20,560 Q120,610 220,560 T440,560"/>
  </g>
  <g fill="none" stroke="#8B5530" stroke-width="0.6"><path d="M-20,340 Q140,300 260,350 T440,330"/></g>
</svg>
<div id="app"></div>

<script>
/* ============== DATOS ============== */
const CAP_NAMES = {
  percepcion:"Percepción", compromiso:"Compromiso", resistencia:"Resistencia",
  discernimiento:"Discernimiento", autoridad:"Autoridad propia", costo:"Costo personal",
  traduccion:"Traducción", coherencia:"Coherencia"
};
const CAP_ART = {percepcion:"la",compromiso:"el",resistencia:"la",discernimiento:"el",autoridad:"la",costo:"el",traduccion:"la",coherencia:"la"};
const CAPACITIES = [
  {id:"percepcion",desc:"Notar la señal antes de que sea obvia; leer lo que el sistema todavía no admite."},
  {id:"compromiso",desc:"Decidir sin garantías; cruzar sabiendo que no hay vuelta atrás."},
  {id:"resistencia",desc:"Sostener el desgaste cuando la fricción se repite."},
  {id:"discernimiento",desc:"Distinguir aliado de adversario, señal de ruido, lo urgente de lo importante."},
  {id:"autoridad",desc:"Confiar en el juicio propio frente a la tentación de la guía externa o el consenso."},
  {id:"costo",desc:"Disposición a pagar con reputación, relación o comodidad propia."},
  {id:"traduccion",desc:"Convertir lo vivido en algo que otros puedan usar, no solo en anécdota."},
  {id:"coherencia",desc:"Que lo que se hace después siga siendo fiel a lo que se dijo antes."}
];
const DIRS = ["N","NE","E","SE","S","SO","O","NO"];

const SKILLS = {
  sk01:{n:"Disciplina sin atajos",d:"Hace lo mismo el día que nadie mira y el día que todos miran.",f:["coherencia","resistencia"],p:[]},
  sk02:{n:"Formación por destreza real",d:"Prefiere formar gente que sepa sobrevivir sin él antes que gente que lo necesite.",f:["resistencia","coherencia"],p:["percepcion"]},
  sk03:{n:"Convicción bajo cuestionamiento",d:"No cede el principio para hacer más cómoda la conversación.",f:["autoridad","coherencia"],p:["compromiso"]},
  sk04:{n:"Ejemplo antes que discurso",d:"Exige de sí mismo antes que de otros.",f:["coherencia"],p:["resistencia","costo"]},
  sk05:{n:"Resiste sin quejarse",d:"Sostiene el peso sin pedir que alguien lo note.",f:["resistencia","costo"],p:[]},
  sk06:{n:"Refuerza la estructura ante la ambigüedad",d:"Trata la excepción como amenaza al sistema, no como información.",f:["coherencia","discernimiento"],p:[]},
  sk07:{n:"Sordera al disenso",d:"Confunde la duda ajena con falta de voluntad.",f:["autoridad"],p:[]},
  sk08:{n:"Desprecio por la ayuda externa",d:"Cruza solo lo que podría cruzar acompañado.",f:["autoridad","resistencia"],p:[]},
  sk09:{n:"Desconfianza de lo no convencional",d:"Lee la desviación como error, no como posible ventaja.",f:["coherencia"],p:["discernimiento"]},
  sk10:{n:"Impaciencia con el proceso",d:"Prefiere actuar ya a esperar un consenso que no llega.",f:["compromiso"],p:[]},
  sk11:{n:"Redobla el principio",d:"Cuanto más se cuestiona el plan, más se aferra a él.",f:["coherencia","autoridad"],p:[]},
  sk12:{n:"Aísla para proteger el código",d:"Cierra filas antes que abrir la conversación.",f:["resistencia"],p:[]},
  sk13:{n:"Absorbe el costo sin pedir ayuda",d:"Sube la apuesta sobre sí mismo antes que ceder terreno.",f:["resistencia","costo"],p:[]},
  sk14:{n:"Memoria de lo ya aprendido",d:"Vuelve a la lección que ya le costó una vez.",f:["discernimiento","coherencia"],p:[]},
  sk15:{n:"Silencia la duda propia",d:"Avanza incluso cuando algo dentro también vacila.",f:["autoridad"],p:[]},
  sk16:{n:"Lectura temprana del riesgo",d:"Ve la grieta antes de que sea noticia.",f:["percepcion","discernimiento"],p:[]},
  sk17:{n:"Legitimidad institucional",d:"Sabe hablar el idioma que la junta necesita oír.",f:["traduccion","coherencia"],p:[]},
  sk18:{n:"Protección de los más expuestos",d:"No sacrifica al más débil del sistema para salvar el plan.",f:["costo","discernimiento"],p:[]},
  sk19:{n:"Calma bajo escrutinio",d:"Mantiene la confianza de afuera incluso cuando adentro todo tiembla.",f:["resistencia","traduccion"],p:[]},
  sk20:{n:"Parálisis ante lo no catalogado",d:"Frente a lo que no tiene precedente, espera a que otro decida primero.",f:["discernimiento"],p:[]},
  sk21:{n:"Confusión entre cumplir y juzgar",d:"Sigue el manual incluso cuando el manual ya no aplica.",f:["coherencia"],p:[]},
  sk22:{n:"Lentitud para nombrar lo obvio",d:"Percibe el riesgo pronto, y aun así espera confirmación de arriba.",f:["percepcion"],p:[]},
  sk23:{n:"Evita el conflicto necesario",d:"Prefiere la paz aparente a la fricción que resolvería el problema de raíz.",f:[],p:["compromiso"]},
  sk24:{n:"Recurre al manual existente",d:"Busca el procedimiento ya escrito antes que inventar uno nuevo.",f:["coherencia"],p:[]},
  sk25:{n:"Busca confirmación externa",d:"Necesita que alguien de afuera confirme que el camino es seguro.",f:["traduccion"],p:[]},
  sk26:{n:"Prioriza no empeorar la situación",d:"Elige la opción más reversible, aunque sea la más lenta.",f:["resistencia","costo"],p:[]},
  sk27:{n:"Escala a la autoridad",d:"Pasa la decisión a quien tiene el cargo, no a quien tiene el criterio.",f:["traduccion"],p:[]},
  sk28:{n:"Traducción entre lógicas opuestas",d:"Encuentra la palabra que ambos bandos pueden aceptar sin traicionarse.",f:["traduccion","discernimiento"],p:[]},
  sk29:{n:"Construcción de terceras opciones",d:"No elige entre las dos salidas ofrecidas: inventa una tercera.",f:["discernimiento","percepcion"],p:[]},
  sk30:{n:"Indecisión leída como falta de convicción",d:"Tarda en decidir lo que ya sabe, esperando que nadie tenga que perder.",f:[],p:["compromiso"]},
  sk31:{n:"Pertenencia a ninguno de los dos bandos",d:"Ambos lados sospechan de su lealtad precisamente porque no es de nadie.",f:[],p:[]},
  sk32:{n:"Evita ser quien paga el costo",d:"Construye el puente y deja que otro decida quién lo cruza primero.",f:[],p:[]},
  sk33:{n:"Sobreadapta su propio criterio",d:"Termina hablando con la voz de la última persona que escuchó.",f:["traduccion"],p:[]},
  sk34:{n:"Ofrece una salida en la que nadie termina de creer del todo",d:"Consigue que todos digan que sí, sin que nadie diga que sí del todo.",f:["traduccion"],p:[]},
  sk35:{n:"Cede su lectura a la del grupo",d:"Deja que la lectura compartida reemplace la propia, incluso cuando esta última era más precisa.",f:[],p:[]}
};

const TREES = {
  purista:{name:"El Purista",short:"Purista",accent:"var(--moss)",cls:"purista",
    philosophy:"Las reglas se prueban, no se debaten. Enseña destreza antes que consuelo, sostiene el mismo principio en la calma y en la tormenta, y mide el liderazgo por lo que su gente puede hacer sin él delante.",
    character:"Inspirado en Ben, el padre",
    characterDetail:"Cría a sus seis hijos aislado en el bosque, con un régimen diario de entrenamiento físico y estudio que no negocia ni siquiera frente a la muerte de su esposa. Insiste en decirles la verdad más cruda sin suavizarla nunca, convencido de que protegerlos de la realidad sería la traición más grande.",
    fortaleza:["sk01","sk02","sk03","sk04","sk05"], puntoCiego:["sk06","sk07","sk08","sk09","sk10"], bajoPresion:["sk11","sk12","sk13","sk14","sk15"]},
  guardian:{name:"El Guardián",short:"Guardián",accent:"var(--bronze)",cls:"guardian",
    philosophy:"La seguridad no es cobardía: es memoria de lo que ya costó aprender. Protege el sistema, cuida a quien tiene menos margen de error, y prefiere la lentitud prudente a la audacia sin red.",
    character:"Inspirado en Jack, el abuelo",
    characterDetail:"Exige la custodia legal de sus nietos, impone un funeral religioso convencional que contradice la voluntad de su hija, y defiende la escuela formal frente a la crianza radical de su yerno. Ya vio de cerca el costo de la vida que Ben eligió, y no está dispuesto a dejar que los niños lo paguen también.",
    fortaleza:["sk14","sk16","sk17","sk18","sk19"], puntoCiego:["sk20","sk21","sk22","sk09","sk23"], bajoPresion:["sk24","sk25","sk26","sk27","sk06"]},
  puente:{name:"El Puente",short:"Puente",accent:"var(--teal)",cls:"puente",
    philosophy:"Ningún bando tiene toda la razón. Traduce entre lógicas que no se hablan, construye lo que cabe entre dos posturas opuestas, y paga el precio de no pertenecer del todo a ninguna.",
    character:"Inspirado en Bo, el hijo mayor",
    characterDetail:"Fue formado por completo bajo el régimen de su padre, y aun así solicita en secreto el ingreso a varias universidades — es aceptado en todas, sin que Ben lo supiera. No rechaza la disciplina que recibió ni acepta sin más el mundo convencional que su padre despreciaba: al final construye un camino que no es del todo ni uno ni el otro.",
    fortaleza:["sk16","sk28","sk18","sk29","sk05"], puntoCiego:["sk30","sk31","sk32","sk33","sk23"], bajoPresion:["sk25","sk13","sk34","sk35","sk26"]}
};
const TREE_KEYS = ["purista","guardian","puente"];
const CATS = ["fortaleza","puntoCiego","bajoPresion"];
const CAT_LABELS = {fortaleza:"Fortalezas",puntoCiego:"Puntos ciegos",bajoPresion:"Bajo presión"};
const CAT_SINGULAR = {fortaleza:"fortaleza",puntoCiego:"punto ciego",bajoPresion:"comportamiento bajo presión"};
const CAT_INTRO = {
  fortaleza:"Lo que te sostiene cuando el terreno se mueve. Elige las cuatro que más se parecen a tu manera real de liderar, no a la que te gustaría tener.",
  puntoCiego:"Lo que no alcanzas a ver de ti cuando estás en medio del problema. Ningún líder carece de ellos: elegirlos con honestidad es lo que vuelve preciso tu diagnóstico.",
  bajoPresion:"Lo que aparece cuando el tiempo se acaba y la tensión sube. Piensa en tu última semana difícil y en cómo reaccionaste de verdad."
};
const PER_CAT = 4, TOTAL = 12;

/* ============== BANCO DE TEXTOS DEL DIAGNÓSTICO ============== */
const EPITETOS = {
  percepcion:"Quien ve la grieta antes de que nadie más la nombre.",
  compromiso:"Quien cruza sabiendo que ya no hay vuelta atrás, y cruza de todos modos.",
  resistencia:"Quien sostiene el peso mucho después de que los demás lo habrían soltado.",
  discernimiento:"Quien distingue lo urgente de lo importante cuando todo parece urgente.",
  autoridad:"Quien no necesita que nadie más firme la decisión para confiar en ella.",

/* ============== ESTADO ============== */
let state = {
  screen:"intro",
  name:"",
  acquired:{},          // id -> {cat, trees:[...]}
  activeCat:"fortaleza",
  filter:"todos",
  capIndex:0,
  capVisited:[true,false,false,false,false,false,false,false],
  needleAngle:0,
  showGlossary:false
};

/* ============== AYUDAS ============== */
function countCat(cat){ return Object.values(state.acquired).filter(a=>a.cat===cat).length; }
function totalCount(){ return Object.keys(state.acquired).length; }
function canCreate(){ return totalCount()===TOTAL && CATS.every(c=>countCat(c)===PER_CAT) && state.name.trim().length>0; }

function catPool(cat){
  const map = {}, order = [];
  TREE_KEYS.forEach(t=>TREES[t][cat].forEach(id=>{
    if(!map[id]){ map[id]=[]; order.push(id); }
    map[id].push(t);
  }));
  return order.map(id=>({id, trees:map[id]}));
}

/* Geometría compartida de la brújula */
const CX=220, CY=190, R=118;
function pt(deg, r){ const a=deg*Math.PI/180; return [CX + r*Math.sin(a), CY - r*Math.cos(a)]; }
function wedgePath(i, r){
  const [x1,y1]=pt(i*45-22.5,r), [x2,y2]=pt(i*45+22.5,r);
  return `M${CX},${CY} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
function capLabel(i, r, cls, extraAttr){
  const ang=i*45, s=Math.sin(ang*Math.PI/180), c=Math.cos(ang*Math.PI/180);
  const [x,y]=pt(ang,r);
  const anchor = s>0.3?"start":(s<-0.3?"end":"middle");
  const dy = c>0.9?-2:(c<-0.9?13:4);
  return `<text class="${cls}" x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}" ${extraAttr||""}>${CAP_NAMES[CAPACITIES[i].id]}</text>`;
}

/* ============== RENDER ============== */
let lastScreen = null;
function render(){
  const entering = state.screen!==lastScreen; lastScreen = state.screen;
  let html = "";
  if(state.screen!=="intro") html += renderHeader();
  html += ({intro:renderIntro,archetypes:renderArchetypes,capacities:renderCapacities,builder:renderBuilder,diagnostic:renderDiagnostic})[state.screen]();
  if(state.showGlossary) html += renderGlossary();
  document.getElementById("app").innerHTML = html;
  if(!entering){ const s=document.querySelector(".screen"); if(s) s.classList.add("noanim"); }
  bindEvents();
}

        <polygon points="${CX-5},${CY} ${CX+5},${CY} ${CX},${CY+26}" fill="var(--moss)"/>
      </g>
      <circle cx="${CX}" cy="${CY}" r="4" fill="var(--ink)"/>
    </svg>
    <div class="compass-count" id="compass-count"></div>

      <div class="eyebrow" style="color:var(--bronze);" id="cap-num"></div>

      <button class="btn ghost small" id="cap-next">Siguiente ›</button>
    </div>
    <button class="btn" id="btn-to-builder"></button>
  </div>`;
}

function updateCompass(animateCard){
  const i = state.capIndex;
  const visitedN = state.capVisited.filter(Boolean).length;
  CAPACITIES.forEach((c,k)=>{
    const cls = k===i ? "current" : (state.capVisited[k] ? "visited" : "");
    document.getElementById("sec-"+k).setAttribute("class","sector "+cls);
    document.getElementById("lab-"+k).setAttribute("class","clabel "+cls);
  });
  document.getElementById("needle").style.transform = `rotate(${state.needleAngle}deg)`;
  const C = 2*Math.PI*(R+12);
  document.getElementById("ring-prog").setAttribute("stroke-dashoffset",(C*(1-visitedN/8)).toFixed(1));
  document.getElementById("compass-count").innerHTML = `<b>${visitedN}</b> de 8 capacidades recorridas`;

  const fill = ()=>{
    if(!document.getElementById("cap-num")) return;
    document.getElementById("cap-num").textContent = `${DIRS[i]} · ${i+1} de 8`;
    document.getElementById("cap-name").textContent = CAP_NAMES[CAPACITIES[i].id];
    document.getElementById("cap-desc").textContent = CAPACITIES[i].desc;
  };
  const card = document.getElementById("cap-card");
  if(animateCard){ card.classList.add("fade"); setTimeout(()=>{ fill(); if(card.isConnected) card.classList.remove("fade"); },180); }
  else fill();

  document.getElementById("cap-prev").disabled = i===0;
  document.getElementById("cap-next").disabled = i===7;
  const go = document.getElementById("btn-to-builder");
  go.disabled = visitedN<8;
  go.textContent = visitedN<8 ? `Recorre las ocho para continuar (${visitedN}/8)` : "Construir mi perfil";
}

function goToCap(i){
  if(i<0||i>7) return;
  const target = i*45;
  const cur = ((state.needleAngle%360)+360)%360;
  const delta = ((target-cur+540)%360)-180;
  state.needleAngle += delta;
  state.capIndex = i;
  state.capVisited[i] = true;
  updateCompass(true);
}

/* ---- Constructor ---- */
function renderBuilder(){
  const cat = state.activeCat;
  const n = totalCount();
  const catN = countCat(cat);
  const pool = catPool(cat).filter(it=> state.filter==="todos" || it.trees.includes(state.filter));

  let html = `<div class="screen" style="padding-bottom:190px;">
    <div class="eyebrow">Paso 3 de 3</div>

      <p>Elige <b>doce habilidades: cuatro en cada categoría</b>. Puedes mezclar libremente los tres liderazgos — cada habilidad lleva una marca de color que dice si viene del <b style="color:var(--moss)">Purista</b>, del <b style="color:var(--bronze)">Guardián</b> o del <b style="color:var(--teal)">Puente</b>. Algunas pertenecen a dos a la vez.</p>
    </div>
    <label class="flabel">Tu nombre</label>
    <input type="text" id="hero-name" placeholder="¿Cómo te llamas?" value="${state.name.replace(/"/g,"&quot;")}">

    <div class="cat-tabs">
      ${CATS.map(c=>{ const k=countCat(c); return `<div class="cat-tab ${c===cat?'active':''} ${k===PER_CAT?'full':''}" data-cat="${c}">
        <span class="ct-name">${CAT_LABELS[c]}</span><span class="ct-count">${k===PER_CAT?"✓ ":""}${k}/${PER_CAT}</span></div>`; }).join("")}
    </div>
    <p class="cat-intro">${CAT_INTRO[cat]}</p>
    <div class="chips">
      ${["todos",...TREE_KEYS].map(f=>`<span class="chip ${state.filter===f?'active':''}" data-filter="${f}">${f==="todos"?"Los tres":TREES[f].short}</span>`).join("")}
    </div>`;

  pool.forEach(it=>{
    const sk = SKILLS[it.id];
    const acq = state.acquired[it.id];
    const mine = acq && acq.cat===cat;
    const elsewhere = acq && acq.cat!==cat;
    const full = !acq && catN>=PER_CAT;
    const disabled = elsewhere || full;
    const tags = sk.f.concat(sk.p).map(c=>`<span class="tag">${CAP_NAMES[c]}</span>`).join("");
    html += `<div class="skill-card ${mine?'selected':''} ${disabled?'disabled':''}" ${disabled?'':`data-sid="${it.id}"`}>
      <div class="sname">${sk.n}</div>
      <div class="sdesc">${sk.d}</div>
      <div class="stags">
        ${it.trees.map(t=>`<span class="badge ${t}">${TREES[t].short}</span>`).join("")}
        ${tags}
        ${elsewhere?`<span class="note">ya la elegiste como ${CAT_SINGULAR[acq.cat]}</span>`:""}
      </div>
    </div>`;
  });

  if(catN===PER_CAT){
    const nextCat = CATS.find(c=>countCat(c)<PER_CAT);
    html += nextCat
      ? `<button class="btn ghost" id="btn-next-cat" data-cat="${nextCat}" style="margin-top:8px;">${CAT_LABELS[cat]} completas ✓ · Ir a ${CAT_LABELS[nextCat]} ›</button>`
      : "";
  }
  html += `</div>`;

  /* Barra de meta */
  const left = TOTAL - n;
  let msg, msgCls="";
  if(n===0) msg = "Empieza por cualquier categoría";
  else if(left>3) msg = `Te faltan ${left}`;
  else if(left>0){ msg = `¡Ya casi! Te ${left===1?"falta 1":"faltan "+left}`; msgCls="near"; }
  else if(!state.name.trim()){ msg = "Escribe tu nombre para terminar"; msgCls="near"; }
  else { msg = "Listo: tu brújula está completa"; msgCls="done"; }
  const done = left===0;
  html += `<div class="footer-bar">
    <div class="goal-top"><span class="gt-count">${n} / ${TOTAL}</span><span class="gt-msg ${msgCls}">${msg}</span></div>
    <div class="goal-cells">${Array.from({length:TOTAL},(_,k)=>`<span class="${k<n?'on':''} ${done?'done':''}"></span>`).join("")}</div>
    <button class="btn" id="btn-create" ${canCreate()?"":"disabled"}>Crear mi perfil de líder</button>
  </div>`;
  return html;
}

/* ---- Diagnóstico ---- */
function computeDiagnostic(){
  const scores = {}; CAPACITIES.forEach(c=>scores[c.id]=0);
  const treeCounts = {purista:0,guardian:0,puente:0};
  Object.entries(state.acquired).forEach(([id,a])=>{
    SKILLS[id].f.forEach(c=>scores[c]+=2);
    SKILLS[id].p.forEach(c=>scores[c]+=1);
    a.trees.forEach(t=>treeCounts[t]+=1/a.trees.length);
  });
  const max = Math.max(1,...Object.values(scores));
  const ranked = CAPACITIES.map(c=>({id:c.id,score:scores[c.id]})).sort((a,b)=>b.score-a.score);
  const top1=ranked[0].id, top2=ranked[1].id, weakest=ranked[ranked.length-1].id;

  const vals = Object.values(treeCounts);
  const balanced = (Math.max(...vals)-Math.min(...vals)) <= 2;
  const maxTree = TREE_KEYS.reduce((a,b)=>treeCounts[a]>=treeCounts[b]?a:b);

  return {
    norm: CAPACITIES.map(c=>scores[c.id]/max),
    top:[top1,top2],
    treeCounts,
    epiteto: EPITETOS[top1],
    acierta: ACIERTA[top1]+" "+ACIERTA[top2],
    vigilar: VIGILAR[top1]+" Hay además una zona poco construida en tu brújula, "+CAP_ART[weakest]+" "+CAP_NAMES[weakest].toLowerCase()+": "+AUSENCIA[weakest],
    cierre: CIERRE[balanced?"balanceado":maxTree]
  };
}

function radarSvg(diag){
  let grid="";
  [0.33,0.66,1].forEach(l=>{
    grid += `<polygon class="radar-grid" points="${CAPACITIES.map((c,i)=>pt(i*45,R*l).map(v=>v.toFixed(1)).join(",")).join(" ")}"/>`;
  });
  CAPACITIES.forEach((c,i)=>{ const [x,y]=pt(i*45,R); grid += `<line class="radar-grid" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  const pts = diag.norm.map((v,i)=>pt(i*45, R*Math.max(0.06,v)));
  const shape = `<polygon class="radar-shape" points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ")}"/>`;
  const dots = pts.map(p=>`<circle class="radar-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`).join("");
  const labels = CAPACITIES.map((c,i)=>capLabel(i, R+22, "rlabel"+(diag.top.includes(c.id)?" top":""))).join("");
  return `<svg class="compass" viewBox="0 0 440 380" role="img" aria-label="Tu brújula">${grid}${shape}${dots}${labels}</svg>`;
}

      <button class="btn" id="btn-print">Descargar tu brújula (PDF)</button>
      <button class="btn ghost" id="btn-edit" style="margin-top:10px;">Ajustar mis elecciones</button>
      <button class="btn ghost" id="btn-restart" style="margin-top:10px;">Empezar de nuevo</button>
    </div>
  </div>`;
}

/* ============== EVENTOS ============== */
function bindEvents(){
  const $ = s=>document.querySelector(s), $$ = s=>document.querySelectorAll(s);
  const go = scr=>{ state.screen=scr; render(); window.scrollTo(0,0); };

  if($("#btn-glossary")) $("#btn-glossary").onclick = ()=>{ state.showGlossary=true; render(); };
  if($("#btn-close-modal")) $("#btn-close-modal").onclick = ()=>{ state.showGlossary=false; render(); };
  if($("#modal-bg")) $("#modal-bg").addEventListener("click",e=>{ if(e.target.id==="modal-bg"){ state.showGlossary=false; render(); }});

  if($("#btn-start")) $("#btn-start").onclick = ()=>go("archetypes");
  if($("#btn-to-capacities")) $("#btn-to-capacities").onclick = ()=>go("capacities");

  if(state.screen==="capacities"){
    updateCompass(false);
    $("#cap-prev").onclick = ()=>goToCap(state.capIndex-1);
    $("#cap-next").onclick = ()=>goToCap(state.capIndex+1);
    $$("[data-cap]").forEach(el=>{ el.onclick = ()=>goToCap(parseInt(el.dataset.cap)); });
    $("#btn-to-builder").onclick = ()=>go("builder");
  }

  if($("#hero-name")) $("#hero-name").oninput = e=>{ state.name = e.target.value; refreshFooter(); };
  $$(".cat-tab").forEach(el=>{ el.onclick = ()=>{ state.activeCat = el.dataset.cat; render(); }; });
  $$(".chip").forEach(el=>{ el.onclick = ()=>{ state.filter = el.dataset.filter; render(); }; });
  if($("#btn-next-cat")) $("#btn-next-cat").onclick = e=>{ state.activeCat = e.currentTarget.dataset.cat; render(); window.scrollTo(0,0); };

  $$(".skill-card[data-sid]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.sid, cat = state.activeCat;
      if(state.acquired[id]) delete state.acquired[id];
      else if(countCat(cat)<PER_CAT){
        const it = catPool(cat).find(x=>x.id===id);
        state.acquired[id] = {cat, trees:it.trees};
      }
      render();
    };
  });

  if($("#btn-create")) $("#btn-create").onclick = ()=>{ if(canCreate()) go("diagnostic"); };
  if($("#btn-print")) $("#btn-print").onclick = ()=>window.print();
  if($("#btn-edit")) $("#btn-edit").onclick = ()=>go("builder");
  if($("#btn-restart")) $("#btn-restart").onclick = ()=>location.reload();
}

function refreshFooter(){
  const btn = document.getElementById("btn-create");
  if(btn) btn.disabled = !canCreate();
  const msg = document.querySelector(".gt-msg");
  if(msg && totalCount()===TOTAL){
    const ok = state.name.trim().length>0;
    msg.textContent = ok ? "Listo: tu brújula está completa" : "Escribe tu nombre para terminar";
    msg.className = "gt-msg " + (ok?"done":"near");
  }
}

render();
</script>
</body>
</html>
