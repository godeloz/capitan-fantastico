<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu brújula de liderazgo — Liderazgo en escena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F0E6;
    --bg2:#EAE4D2;
    --panel:#FFFFFF;
    --line:rgba(63,90,58,0.18);
    --teal:#0E8F84;
    --gold:#C99A2E;
    --gold-light:#F5C842;
    --moss:#3F5A3A;
    --bronze:#8B5530;
    --ink:#26301F;
    --text:#2B3328;
    --text-dim:#6E7C66;
    --cream-text:#FDFBF4;
    --font-d:'Bebas Neue',sans-serif;
    --font-b:'Playfair Display',serif;
    --font-m:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-b);}
  body{min-height:100vh;position:relative;overflow-x:hidden;}
  .bg-contours{position:fixed;inset:0;z-index:0;opacity:0.10;pointer-events:none;}
  #app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  ::selection{background:var(--gold-light);color:var(--ink);}

  .eyebrow{font-family:var(--font-m);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal);margin:0 0 8px;}
  h1,h2,h3{font-family:var(--font-d);letter-spacing:0.02em;font-weight:400;margin:0;}
  h1{font-size:40px;line-height:1.05;color:var(--ink);}
  h2{font-size:28px;color:var(--ink);}
  h3{font-size:20px;color:var(--bronze);}
  p{line-height:1.65;margin:0 0 14px;color:var(--text);}
  .dim{color:var(--text-dim);}
  .italic{font-style:italic;color:var(--moss);}

  .screen{padding:28px 20px 100px;flex:1;animation:fadein 0.4s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .btn{
    font-family:var(--font-d);font-size:16px;letter-spacing:0.06em;text-transform:uppercase;
    background:var(--moss);color:var(--cream-text);border:none;border-radius:3px;
    padding:14px 22px;cursor:pointer;width:100%;transition:transform 0.15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{background:var(--line);color:var(--text-dim);cursor:not-allowed;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.small{padding:9px 14px;font-size:13px;width:auto;flex:1;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:12px;}
  .card.dossier{background:linear-gradient(180deg,var(--panel),var(--bg2));border-left:3px solid var(--gold-light);}

  .header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:rgba(243,240,230,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .header .logo{font-family:var(--font-d);font-size:18px;letter-spacing:0.05em;color:var(--bronze);}
  .info-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text-dim);
    font-family:var(--font-m);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:10px 4px;font-family:var(--font-d);font-size:14px;letter-spacing:0.04em;
    border-radius:3px;border:1px solid var(--line);cursor:pointer;color:var(--text-dim);background:transparent;text-transform:uppercase;}
  .tab.active{color:var(--cream-text);}
  .tab.active[data-t="purista"]{background:var(--moss);}
  .tab.active[data-t="guardian"]{background:var(--bronze);}
  .tab.active[data-t="puente"]{background:var(--teal);}

  .cat-label{font-family:var(--font-m);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);
    margin:18px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--line);}

  .skill-card{border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin-bottom:8px;cursor:pointer;
    background:var(--bg2);transition:border-color 0.15s,background 0.15s;}
  .skill-card.selected{border-color:var(--gold);background:rgba(201,154,46,0.12);}
  .skill-card.disabled{opacity:0.45;cursor:default;}
  .skill-card .sname{font-family:var(--font-b);font-weight:600;font-size:15px;color:var(--ink);margin-bottom:3px;}
  .skill-card .sdesc{font-size:13px;color:var(--text-dim);font-style:italic;line-height:1.4;}
  .skill-card .stags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-family:var(--font-m);font-size:10px;letter-spacing:0.03em;padding:2px 7px;border-radius:10px;
    background:rgba(14,143,132,0.12);color:var(--teal);border:1px solid rgba(14,143,132,0.3);}
  .tag.owned-else{background:rgba(110,124,102,0.12);color:var(--text-dim);border-color:var(--line);}

  .footer-bar{position:sticky;bottom:0;z-index:20;background:rgba(243,240,230,0.96);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);padding:12px 20px;}
  .progress-line{font-family:var(--font-m);font-size:12px;color:var(--text-dim);margin-bottom:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
  .progress-line b{color:var(--gold);}
  .ok{color:var(--moss);}

  input[type=text]{width:100%;padding:12px;border-radius:3px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-family:var(--font-b);font-size:15px;margin-bottom:14px;}
  label.flabel{font-family:var(--font-m);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);display:block;margin-bottom:6px;}

  .modal-bg{position:fixed;inset:0;background:rgba(20,25,18,0.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--panel);border-top:1px solid var(--line);border-radius:10px 10px 0 0;padding:22px 20px 30px;
    max-width:560px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal h3{margin-bottom:14px;}
  .cap-item{margin-bottom:14px;}
  .cap-item .cname{font-family:var(--font-b);font-weight:600;color:var(--gold);margin-bottom:2px;}
  .cap-item .cdesc{font-size:13px;color:var(--text-dim);}

  .arch-card{border-radius:4px;padding:18px;margin-bottom:14px;border:1px solid var(--line);background:var(--panel);}
  .arch-card.purista{border-left:3px solid var(--moss);}
  .arch-card.guardian{border-left:3px solid var(--bronze);}
  .arch-card.puente{border-left:3px solid var(--teal);}

  .divider{height:1px;background:var(--line);margin:22px 0;}

  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;display:inline-block;}
  .dot.active{background:var(--bronze);}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
  .bar-label{width:118px;font-family:var(--font-m);font-size:10.5px;color:var(--text-dim);flex-shrink:0;}
  .bar-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--teal));border-radius:4px;}
  .diag-list{margin:0;padding-left:18px;}
  .diag-list li{margin-bottom:8px;font-size:14px;}

  @media print{
    .header,.footer-bar,.no-print,.bg-contours{display:none !important;}
    body{background:#fff;}
    .card{border:1px solid #ccc;break-inside:avoid;}
  }
</style>
</head>

<script>
/* ============== DATA (idéntica a la app del viaje) ============== */

const TREES = {
  purista:{name:"El Purista",accent:"var(--moss)",cls:"purista",
    philosophy:"Las reglas se prueban, no se debaten. Enseña destreza antes que consuelo, sostiene el mismo principio en la calma y en la tormenta, y mide el liderazgo por lo que su gente puede hacer sin él delante.",
    character:"Inspirado en Ben, el padre",
    characterDetail:"Cría a sus seis hijos aislado en el bosque, con un régimen diario de entrenamiento físico y estudio que no negocia ni siquiera frente a la muerte de su esposa. Insiste en decirles la verdad más cruda sin suavizarla nunca, convencido de que protegerlos de la realidad sería la traición más grande.",

    characterDetail:"Exige la custodia legal de sus nietos, impone un funeral religioso convencional que contradice la voluntad de su hija, y defiende la escuela formal frente a la crianza radical de su yerno. Ya vio de cerca el costo de la vida que Ben eligió, y no está dispuesto a dejar que los niños lo paguen también.",

    puntoCiego:["sk20","sk21","sk22","sk09","sk23"],
    bajoPresion:["sk24","sk25","sk26","sk27","sk06"]},
  puente:{name:"El Puente",accent:"var(--teal)",cls:"puente",

    characterDetail:"Fue formado por completo bajo el régimen de su padre, y aun así solicita en secreto el ingreso a varias universidades — es aceptado en todas, sin que Ben lo supiera. No rechaza la disciplina que recibió ni acepta sin más el mundo convencional que su padre despreciaba: al final construye un camino que no es del todo ni uno ni el otro.",

const CAT_LABELS = {fortaleza:"Fortalezas",puntoCiego:"Puntos ciegos",bajoPresion:"Bajo presión"};

/* ============== STATE ============== */
let state = {
  screen:"intro",
  hero:{name:"",acquired:{}},
  activeTab:"purista",
  capIndex:0,
  showGlossary:false
};

/* ============== HELPERS ============== */
function acquiredCount(){ return Object.keys(state.hero.acquired).length; }
function countByCat(cat){ return Object.values(state.hero.acquired).filter(a=>a.cat===cat).length; }
function allAcquiredIds(){ return Object.keys(state.hero.acquired); }

function capTags(sk){
  let tags=[];
  sk.f.forEach(c=>tags.push({name:CAP_NAMES[c],strong:true}));
  sk.p.forEach(c=>tags.push({name:CAP_NAMES[c],strong:false}));
  return tags;
}

function computeCapacityProfile(){
  let scores = {}; CAPACITIES.forEach(c=>scores[c.id]=0);
  allAcquiredIds().forEach(id=>{
    const sk = SKILLS[id];
    sk.f.forEach(c=>scores[c]+=2);
    sk.p.forEach(c=>scores[c]+=1);
  });
  const max = Math.max(1, ...Object.values(scores));
  return {scores, bars: CAPACITIES.map(c=>({id:c.id,name:CAP_NAMES[c.id],pct:Math.round(scores[c.id]/max*100)}))};
}

function computeDiagnostic(){
  const cap = computeCapacityProfile();
  const ranked = CAPACITIES.map(c=>({id:c.id,score:cap.scores[c.id]})).sort((a,b)=>b.score-a.score);
  const top1 = ranked[0].id, top2 = ranked[1].id, weakest = ranked[ranked.length-1].id;

  let treeCounts = {purista:0,guardian:0,puente:0};
  Object.values(state.hero.acquired).forEach(a=>{ treeCounts[a.tree]++; });
  const sortedCounts = Object.values(treeCounts).slice().sort((a,b)=>b-a);
  const balanced = (sortedCounts[0]-sortedCounts[2]) <= 3;
  const maxTree = Object.keys(treeCounts).reduce((a,b)=>treeCounts[a]>=treeCounts[b]?a:b);
  const leaningKey = balanced ? "balanceado" : maxTree;

  return {
    bars: cap.bars,
    treeCounts,
    epiteto: EPITETOS[top1],
    acierta: ACIERTA[top1] + " " + ACIERTA[top2],
    vigilar: VIGILAR[top1] + " Por otro lado, construyó poco alrededor de " + CAP_NAMES[weakest].toLowerCase() + ": " + AUSENCIA[weakest],
    cierre: CIERRE[leaningKey]
  };
}

/* ============== RENDER ROOT ============== */
function render(){
  const app = document.getElementById("app");
  let html = "";
  if(state.screen!=="intro") html += renderHeader();
  switch(state.screen){
    case "intro": html += renderIntro(); break;
    case "archetypes": html += renderArchetypes(); break;
    case "capacities": html += renderCapacities(); break;
    case "builder": html += renderBuilder(); break;
    case "diagnostic": html += renderDiagnostic(); break;
  }
  if(state.showGlossary) html += renderGlossary();
  app.innerHTML = html;
  bindEvents();
}

function renderHeader(){
  return `<div class="header">
    <div class="logo">TU BRÚJULA DE LIDERAZGO</div>
    <button class="info-btn" id="btn-glossary">i</button>
  </div>`;
}

function renderGlossary(){
  return `<div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h3>La brújula de exigencias</h3>
      <p class="dim" style="margin-bottom:16px;font-size:13px;">Ocho capacidades que un liderazgo pone en juego, en proporciones distintas según quién lo ejerza.</p>
      ${CAPACITIES.map(c=>`<div class="cap-item"><div class="cname">${CAP_NAMES[c.id]}</div><div class="cdesc">${c.desc}</div></div>`).join("")}
      <button class="btn ghost" id="btn-close-modal">Cerrar</button>
    </div>

}

/* ============== SCREEN: INTRO ============== */
function renderIntro(){
  return `<div class="screen" style="display:flex;flex-direction:column;justify-content:center;min-height:100vh;">
    <div class="eyebrow">Liderazgo en escena</div>

    <button class="btn" id="btn-start">Comenzar</button>
  </div>`;
}

/* ============== SCREEN: ARCHETYPES ============== */

  <p class="dim" style="margin-bottom:4px;font-size:14px;">Ninguna es la correcta. Cada una sostiene algo distinto, y cada una tiene un costo que no siempre se ve a tiempo.</p>
  <p class="dim" style="margin-bottom:18px;font-size:13px;">Los tres están inspirados en tres personajes de <span class="italic" style="font-size:13px;">Capitán Fantástico</span> (2016).</p>`;
  Object.keys(TREES).forEach(k=>{
    const t = TREES[k];
    html += `<div class="arch-card ${t.cls}">
      <h3 style="color:${t.accent};">${t.name}</h3>
      <p style="font-size:14px;margin-top:8px;">${t.philosophy}</p>
      <div class="divider" style="margin:12px 0;"></div>
      <div class="eyebrow" style="color:${t.accent};margin-bottom:4px;">${t.character}</div>
      <p style="font-size:13.5px;margin:0;color:var(--text-dim);">${t.characterDetail}</p>
    </div>`;
  });
  html += `<button class="btn" id="btn-to-capacities">Conocer la brújula de exigencias</button></div>`;

/* ============== SCREEN: CAPACITIES ============== */
function renderCapacities(){
  const i = state.capIndex||0;
  const c = CAPACITIES[i];
  return `<div class="screen">
    <div class="eyebrow">La brújula de exigencias</div>
    <h2 style="margin-bottom:10px;">Ocho capacidades</h2>
    <p class="dim" style="margin-bottom:18px;font-size:14px;">Tu perfil final se va a leer a través de estas ocho capacidades. Vale la pena conocerlas antes de construirlo.</p>
    <div class="card" style="min-height:140px;">
      <div class="eyebrow" style="color:var(--bronze);">${i+1} / ${CAPACITIES.length}</div>
      <h3 style="margin-bottom:10px;">${CAP_NAMES[c.id]}</h3>
      <p style="margin:0;">${c.desc}</p>
    </div>
    <div style="display:flex;gap:8px;margin:14px 0;">
      <button class="btn ghost small" id="cap-prev" ${i===0?"disabled":""}>‹ Anterior</button>
      <button class="btn ghost small" id="cap-next" ${i===CAPACITIES.length-1?"disabled":""}>Siguiente ›</button>
    </div>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:26px;">
      ${CAPACITIES.map((cc,idx)=>`<span class="dot ${idx===i?'active':''}" data-jump="${idx}"></span>`).join("")}
    </div>
    <button class="btn" id="btn-to-builder">Construir mi perfil</button>
  </div>`;
}

/* ============== SCREEN: BUILDER ============== */
function renderBuilder(){
  const tree = TREES[state.activeTab];
  const total = acquiredCount();
  const fC = countByCat("fortaleza"), pC = countByCat("puntoCiego"), bC = countByCat("bajoPresion");
  const canProceed = total===18 && fC>=3 && pC>=3 && bC>=3 && state.hero.name.trim().length>0;

  let html = `<div class="screen" style="padding-bottom:170px;">
    <h2 style="margin-bottom:10px;">Construye tu perfil</h2>
    <div class="card" style="margin-bottom:16px;">
      <p style="margin:0;font-size:14px;">Vas a elegir <b>dieciocho habilidades</b> en total, sin importar de qué árbol vengan. Necesitas al menos <b>tres Fortalezas</b>, <b>tres Puntos ciegos</b> y <b>tres comportamientos Bajo presión</b> — ningún perfil real evita tener vulnerabilidades. Tu diagnóstico se construye exactamente a partir de esta elección.</p>
    </div>
    <label class="flabel">Tu nombre</label>
    <input type="text" id="hero-name" placeholder="¿Cómo te llamas?" value="${state.hero.name}">

    <div class="tabs">
      ${Object.keys(TREES).map(k=>`<div class="tab ${state.activeTab===k?'active':''}" data-t="${k}">${TREES[k].name}</div>`).join("")}
    </div>
    <p class="dim" style="font-size:13px;margin-bottom:4px;">${tree.philosophy}</p>
  `;

  ["fortaleza","puntoCiego","bajoPresion"].forEach(cat=>{
    html += `<div class="cat-label">${CAT_LABELS[cat]}</div>`;
    tree[cat].forEach(id=>{
      const sk = SKILLS[id];
      const acq = state.hero.acquired[id];
      const ownedHere = acq && acq.tree===state.activeTab && acq.cat===cat;
      const ownedElsewhere = acq && !ownedHere;
      const tags = capTags(sk);
      html += `<div class="skill-card ${ownedHere?'selected':''} ${ownedElsewhere?'disabled':''}" ${ownedElsewhere?'':`data-sid="${id}" data-cat="${cat}"`}>
        <div class="sname">${sk.n}</div>
        <div class="sdesc">${sk.d}</div>
        <div class="stags">
          ${tags.map(t=>`<span class="tag">${t.name}</span>`).join("")}
          ${ownedElsewhere?`<span class="tag owned-else">ya la tienes (vía ${TREES[acq.tree].name})</span>`:""}
        </div>
      </div>`;
    });
  });

  html += `</div>
  <div class="footer-bar">
    <div class="progress-line">
      <span><b>${total}/18</b> elegidas</span>
      <span class="${fC>=3?'ok':''}">Fortalezas ${fC}/3</span>
      <span class="${pC>=3?'ok':''}">Puntos ciegos ${pC}/3</span>
      <span class="${bC>=3?'ok':''}">Bajo presión ${bC}/3</span>
    </div>
    <button class="btn" id="btn-create-profile" ${canProceed?"":"disabled"}>Crear mi perfil de líder</button>
  </div>`;
  return html;
}

/* ============== SCREEN: DIAGNOSTIC ============== */
function renderDiagnostic(){
  const diag = computeDiagnostic();
  const byCat = {fortaleza:[],puntoCiego:[],bajoPresion:[]};
  Object.keys(state.hero.acquired).forEach(id=>{ byCat[state.hero.acquired[id].cat].push(id); });
  const maxTree = Math.max(1, ...Object.values(diag.treeCounts));

  let html = `<div class="screen">
    <div class="eyebrow">Diagnóstico</div>
    <h2 style="margin-bottom:4px;">${state.hero.name}</h2>
    <p class="italic" style="font-size:16px;margin-bottom:20px;">${diag.epiteto}</p>

    <div class="card">
      <h3 style="margin-bottom:14px;">Tu brújula</h3>
      ${diag.bars.map(p=>`
        <div class="bar-row">
          <div class="bar-label">${p.name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(6,p.pct)}%;"></div></div>
        </div>`).join("")}
    </div>

    <div class="card">
      <h3 style="margin-bottom:14px;">De dónde viene tu liderazgo</h3>
      ${["purista","guardian","puente"].map(k=>{
        const pct = Math.round(diag.treeCounts[k]/maxTree*100);
        return `<div class="bar-row">
          <div class="bar-label">${TREES[k].name}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.max(6,pct)}%;background:${TREES[k].accent};"></div></div>
        </div>`;
      }).join("")}
    </div>

    <div class="card"><div class="eyebrow" style="color:var(--moss);">Fortalezas elegidas</div>
      <ul class="diag-list">${byCat.fortaleza.map(id=>`<li><b>${SKILLS[id].n}</b> — ${SKILLS[id].d}</li>`).join("")}</ul></div>
    <div class="card"><div class="eyebrow" style="color:var(--bronze);">Puntos ciegos elegidos</div>
      <ul class="diag-list">${byCat.puntoCiego.map(id=>`<li><b>${SKILLS[id].n}</b> — ${SKILLS[id].d}</li>`).join("")}</ul></div>
    <div class="card"><div class="eyebrow" style="color:var(--teal);">Bajo presión</div>
      <ul class="diag-list">${byCat.bajoPresion.map(id=>`<li><b>${SKILLS[id].n}</b> — ${SKILLS[id].d}</li>`).join("")}</ul></div>

    <div class="card"><h3 style="margin-bottom:8px;">Dónde puede acertar</h3><p style="margin:0;">${diag.acierta}</p></div>
    <div class="card"><h3 style="margin-bottom:8px;">Qué vigilar</h3><p style="margin:0;">${diag.vigilar}</p></div>

    <p class="italic" style="font-size:17px;text-align:center;margin:24px 0;">${diag.cierre}</p>

    <div class="no-print">
      <button class="btn" id="btn-print">Descargar tu brújula (PDF)</button>
      <button class="btn ghost" id="btn-restart" style="margin-top:10px;">Construir otro perfil</button>
    </div>
  </div>`;
  return html;
}

/* ============== EVENT BINDING ============== */
function bindEvents(){
  const $ = s=>document.querySelector(s);
  const $$ = s=>document.querySelectorAll(s);

  if($("#btn-glossary")) $("#btn-glossary").onclick = ()=>{ state.showGlossary=true; render(); };
  if($("#btn-close-modal")) $("#btn-close-modal").onclick = ()=>{ state.showGlossary=false; render(); };
  if($("#modal-bg")) $("#modal-bg").addEventListener("click",(e)=>{ if(e.target.id==="modal-bg"){ state.showGlossary=false; render(); }});

  if($("#btn-start")) $("#btn-start").onclick = ()=>{ state.screen="archetypes"; render(); };
  if($("#btn-to-capacities")) $("#btn-to-capacities").onclick = ()=>{ state.screen="capacities"; render(); };
  if($("#cap-prev")) $("#cap-prev").onclick = ()=>{ state.capIndex = Math.max(0,(state.capIndex||0)-1); render(); };
  if($("#cap-next")) $("#cap-next").onclick = ()=>{ state.capIndex = Math.min(CAPACITIES.length-1,(state.capIndex||0)+1); render(); };
  $$(".dot[data-jump]").forEach(el=>{ el.onclick = ()=>{ state.capIndex = parseInt(el.dataset.jump); render(); }; });
  if($("#btn-to-builder")) $("#btn-to-builder").onclick = ()=>{ state.screen="builder"; render(); };

  if($("#hero-name")) $("#hero-name").oninput = (e)=>{ state.hero.name = e.target.value; refreshFooterOnly(); };

  $$(".tab").forEach(el=>{ el.onclick = ()=>{ state.activeTab = el.dataset.t; render(); }; });

  $$(".skill-card[data-sid]").forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.sid, cat = el.dataset.cat;
      const acq = state.hero.acquired[id];
      if(acq && acq.tree===state.activeTab && acq.cat===cat){
        delete state.hero.acquired[id];
      } else if(!acq){
        if(acquiredCount()>=18) return;
        state.hero.acquired[id] = {tree:state.activeTab, cat:cat};
      }
      render();
    };
  });

  if($("#btn-create-profile")) $("#btn-create-profile").onclick = ()=>{ state.screen="diagnostic"; render(); };
  if($("#btn-print")) $("#btn-print").onclick = ()=>{ window.print(); };
  if($("#btn-restart")) $("#btn-restart").onclick = ()=>{ location.reload(); };
}

function refreshFooterOnly(){
  const btn = document.getElementById("btn-create-profile");
  if(btn){
    const canProceed = acquiredCount()===18 && countByCat("fortaleza")>=3 && countByCat("puntoCiego")>=3 && countByCat("bajoPresion")>=3 && state.hero.name.trim().length>0;
    btn.disabled = !canProceed;
  }
}

/* ============== INIT ============== */
render();
</script>

</html>
